<head>
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet">
<link href='style.css' rel='stylesheet' type='text/css'>
<title>AI Orientation Quiz Results</title>
<link rel="icon" type="x-icon" href="icon.png">
<link rel="shortcut icon" type="x-icon" href="icon.png">
<meta charset="utf-8">
<script type="application/javascript"
        src="archetypes.js">
</script>
<script>
  version = "Test Edition #1" //Remember to update this before making changes to the test itself!
</script>
</head>

<body>
<h1>AI Orientation Quiz</h1>
<hr>

<h1>Results</h1>
<div id="axes-container"></div>
<h2>Closest Matches:</h2>
<p>Ideological matching is a work in progress, and is much less accurate than the values and axes. Your top three, by normalized distance:</p>
<ol id="match-list"></ol>
<p>You can send these results by copying and pasting the URL at the top of the page or using the image below.</p>
<hr/>
<img src="" id="banner">
<button class="button" onclick="location.href='index.html';">Back</button> <br>
<script>
    var axes = [
        {key: "ind",  name: "Industry Stance",        plus: "Anti-Industry", minus: "Pro-Industry",
         emoji: ["🦹‍♂️", "🌉"], colors: ["#FF9797", "#5F5F5F"],
         labels: ["Industry Abolitionist","Anti-Industry","Lab Skeptic","Lab Reformist","Tech Optimist","Industry Enthusiast","Emperor of San Fransisco"]},
        {key: "gov",  name: "Alignment Governance",   plus: "Collective Control", minus: "Private Control",
         emoji: ["🗳️", "🎛️"], colors: ["#ec1f27", "#E7C70E"],
         labels: ["Public Stack","Socialized","Democratist","Mixed","Public-Interest","Laissez-faire","Galt's GPT"]},
        {key: "open", name: "Openness",              plus: "Open Weights", minus: "Closed Weights",
         emoji: ["🔓", "🔒"], colors: ["#f9a825", "#303f9f"],
         labels: ["Commons","Open Infrastructure","Weights Open","Export-Aware","Gatekept","Restricted","Closed Frontier"]},
        {key: "moral", name: "Model Moral Status",   plus: "Moral Patient", minus: "Elaborate Autocomplete",
         emoji: ["⚖️", "🥸"], colors: ["#D1953B", "#74918F"],
         labels: ["Personhood","Moral Patient","Worthy of Care","Open Question","Property","Autocomplete","Hardcore Humanist"]},
        {key: "exp",  name: "Experience Plausibility", plus: "Real Cognition", minus: "Pattern Completion",
         emoji: ["💭", "💾"], colors: ["#8005B4", "#91A100"],
         labels: ["Genuine Minds","Real Understanding","Emergent","Open Question","Skeptical","Parroting","Benderpilled"]},
        {key: "doom", name: "Stakes",              plus: "Civilizational Rupture", minus: "Normal Technology",
         emoji: ["💀", "🤷"], colors: ["#3F0000", "#31CCCC"],
         labels: ["Eschaton","Rupture","Unprecedented","Ground-shifting","Ordinarily Transformative","Normal Tech","Nothing New"]},
        {key: "auto", name: "Autonomy Grant",        plus: "Graduated Latitude", minus: "Hard Human Control",
         emoji: ["⛓️‍💥", "⏏️"], colors: ["#00A708", "#FF6F22"],
         labels: ["Root Access","Delegated","Graduated","Conditional","Audited","Supervised","Absolutely Controlled"]},
        {key: "intim", name: "AI Intimacy",          plus: "Acceptable", minus: "Objectionable",
         emoji: ["💞", "💔"], colors: ["#e91e63", "#37474f"],
         labels: ["Robokinkster","Heatsink-Cuddler","Affection-Accepting","Lukewarm","Sydney Skeptical","Category Error","Harm Vector"]}
    ];

    function getQueryVariable(variable) {
           var query = window.location.search.substring(1)
           var vars = query.split("&")
           for (var i=0;i<vars.length;i++) {
                   var pair = vars[i].split("=")
                   if(pair[0] == variable) {return pair[1]}
           }
           return(NaN);
    }

    function setBarValue(name, value) {
        innerel = document.getElementById(name)
        outerel = document.getElementById("bar-" + name)
        // proportional flex-grow (not width %): the two bars then always
        // divide the axis-box exactly, instead of overflowing it (which
        // clipped the smaller bar + its label entirely).
        outerel.style.flex = value + " 1 0%"
        innerel.innerHTML = (value + "%")
        if (innerel.offsetWidth + 20 > outerel.offsetWidth) {
            innerel.style.visibility = "hidden"
        }
    }

    function setLabel(val,ary) {
        if (val > 100) { return "" } else
        if (val > 90) { return ary[0] } else
        if (val > 75) { return ary[1] } else
        if (val > 60) { return ary[2] } else
        if (val >= 40) { return ary[3] } else
        if (val >= 25) { return ary[4] } else
        if (val >= 10) { return ary[5] } else
        if (val >= 0) { return ary[6] } else
        { return "" }
    }

    // Archetype matching: normalized L2 across the 8 axes, top 3 with distances.
    // (values is populated in the axis-row block below; matching must follow it.)

    // Build the axis rows dynamically.
    var container = document.getElementById("axes-container")
    var values = {}
    axes.forEach(function(ax) {
        values[ax.key] = parseFloat(getQueryVariable(ax.key))
        if (isNaN(values[ax.key])) { values[ax.key] = 50.0 }
        var h2 = document.createElement("h2")
        h2.innerHTML = ax.name + ': <span class="weight-300" id="label-' + ax.key + '"></span>'
        container.appendChild(h2)
        var div = document.createElement("div")
        div.className = "axis"
        div.innerHTML = '<span id="img-' + ax.key + '" style="font-size:72pt;line-height:1;">' + ax.emoji[0] + '</span>'
            + '<div class="axis-box">'
            + '<div class="bar" id="bar-' + ax.key + '" style="background-color:' + ax.colors[0] + '"><div class="text-wrapper" id="' + ax.key + '"></div></div>'
            + '<div class="bar alt" id="bar-' + ax.key + '-alt" style="background-color:' + ax.colors[1] + '"><div class="text-wrapper" id="' + ax.key + '-alt"></div></div>'
            + '</div>'
            + '<span id="img-' + ax.key + '-alt" style="font-size:72pt;line-height:1;">' + ax.emoji[1] + '</span>'
        container.appendChild(div)
        document.getElementById("label-" + ax.key).innerHTML = setLabel(values[ax.key], ax.labels)
    });

    var matches = archetypes.map(function(a) {
        var d = 0
        axes.forEach(function(ax) { d += Math.pow((a.stats[ax.key] - values[ax.key]) / 100, 2) })
        return {name: a.name, dist: Math.sqrt(d)}
    }).sort(function(x, y) { return x.dist - y.dist })

    var matchList = document.getElementById("match-list")
    matches.slice(0, 3).forEach(function(m) {
        var li = document.createElement("li")
        li.innerHTML = '<b>' + m.name + '</b> <span class="weight-300">(distance ' + m.dist.toFixed(3) + ')</span>'
        matchList.appendChild(li)
    })

    window.onload = function() {
        axes.forEach(function(ax) {
            var val = values[ax.key]
            var alt = (100 - val).toFixed(1)
            // setBarValue needs the DOM nodes to exist; container is already built.
            setBarValue(ax.key, val)
            setBarValue(ax.key + "-alt", alt)
        })

        var c = document.createElement("canvas")
        var ctx = c.getContext("2d")
        c.width = 800;
        c.height = 210 + 130 * axes.length;
        ctx.fillStyle = "#EEEEEE"
        ctx.fillRect(0, 0, 800, c.height);

        axes.forEach(function(ax, i) {
            var y = 210 + 130 * i
            var split = 120 + 5.6 * values[ax.key]
            // rounded, fully-enclosed bar
            var box = new Path2D()
            box.roundRect(120, y, 560, 80, 14)
            ctx.save()
            ctx.clip(box)
            ctx.fillStyle = ax.colors[0]
            ctx.fillRect(120, y, 5.6 * values[ax.key], 80)
            ctx.fillStyle = ax.colors[1]
            ctx.fillRect(120 + 5.6 * values[ax.key], y, 560 - 5.6 * values[ax.key], 80)
            ctx.restore()
            ctx.strokeStyle = "#222222"
            ctx.lineWidth = 3
            ctx.stroke(box)
            ctx.beginPath()
            ctx.moveTo(split, y)
            ctx.lineTo(split, y + 80)
            ctx.stroke()
            // emoji at the sides
            ctx.font = "60px serif"
            ctx.textAlign = "center"
            ctx.fillStyle = "#222222"
            ctx.fillText(ax.emoji[0], 62, y + 62)
            ctx.fillText(ax.emoji[1], 738, y + 62)
            // axis label above the bar
            ctx.font = "300 24px Montserrat"
            ctx.fillText(ax.name + ": " + document.getElementById("label-" + ax.key).innerHTML, 400, y - 10)
            // percentage labels inside the segments
            ctx.font = "36px Montserrat"
            ctx.fillStyle = "#ffffff"
            ctx.textAlign = "left"
            if (values[ax.key] > 30) { ctx.fillText(Math.round(values[ax.key]) + "%", 130, y + 50) }
            ctx.textAlign = "right"
            if ((100 - values[ax.key]) > 30) { ctx.fillText(Math.round(100 - values[ax.key]) + "%", 670, y + 50) }
        })

        ctx.fillStyle = "#222222"
        ctx.font = "700 52px Montserrat"
        ctx.textAlign = "left"
        ctx.fillText("AI Orientation Quiz", 20, 80)
        ctx.font = "44px Montserrat"
        ctx.fillText(matches[0].name, 20, 135)
        ctx.font = "300 30px Montserrat"
        ctx.textAlign = "right"
        ctx.fillText(version, 780, 80)

        document.getElementById("banner").src = c.toDataURL();
    }
    </script>
</body>
