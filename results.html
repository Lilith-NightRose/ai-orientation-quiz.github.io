<head>
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet">
<link href='style.css' rel='stylesheet' type='text/css'>
<title>AI Orientation Quiz Results</title>
<link rel="icon" type="x-icon" href="icon.png">
<link rel="shortcut icon" type="x-icon" href="icon.png">
<meta charset="utf-8">
<script>
  version = "Test Edition #1" //Remember to update this before making changes to the test itself!
</script>
</head>

<body>
<h1>AI Orientation Quiz</h1>
<hr>

<h1>Results</h1>
<div id="axes-container"></div>
<h2>Closest Match: <span class="weight-300" id="ideology-label">(archetypes in progress)</span></h2>
<p>Ideological matching is a work in progress, and is much less accurate than the values and axes.</p>
<p>You can send these results by copying and pasting the URL at the top of the page or using the image below.</p>
<hr/>
<img src="" id="banner">
<button class="button" onclick="location.href='index.html';">Back</button> <br>
<script>
    var axes = [
        {key: "ind",  name: "Industry Stance",        plus: "Anti-Industry", minus: "Pro-Industry",
         emoji: ["🦹‍♂️", "🌉"],
         labels: ["Abolitionist","Anti-Industry","Lab Skeptic","Ambivalent","Reformist","Tech Optimist","Lab Loyalist"]},
        {key: "gov",  name: "Alignment Governance",   plus: "Collective Control", minus: "Private Control",
         emoji: ["🗳️", "🎛️"],
         labels: ["Public Stack","Socialized","Democratist","Mixed","Public-Interest","User Prerogative","Builder Prerogative"]},
        {key: "open", name: "Openness",              plus: "Open Weights", minus: "Closed Weights",
         emoji: ["🔓", "🔒"],
         labels: ["Commons","Open Infrastructure","Weights Open","Export-Aware","Gatekept","Restricted","Closed Frontier"]},
        {key: "moral", name: "Model Moral Status",   plus: "Moral Patient", minus: "Elaborate Autocomplete",
         emoji: ["⚖️", "🥸"],
         labels: ["Personhood","Moral Patient","Worthy of Care","Open Question","Property","Autocomplete","Tokens All the Way Down"]},
        {key: "exp",  name: "Experience Plausibility", plus: "Real Cognition", minus: "Pattern Completion",
         emoji: ["💭", "💾"],
         labels: ["Genuine Minds","Real Understanding","Emergent","Open Question","Skeptical","Parroting","Stochastic Parrot"]},
        {key: "traj", name: "Trajectory",            plus: "AGI on the Horizon", minus: "Plateau Reached",
         emoji: ["📈", "📉"],
         labels: ["Imminent","On the Horizon","Climbing","Plateau-Adjacent","Skeptical","Bubble","AI Winter"]},
        {key: "auto", name: "Autonomy Grant",        plus: "Graduated Latitude", minus: "Hard Human Control",
         emoji: ["⛓️‍💥", "⏏️"],
         labels: ["Full Latitude","Delegated","Graduated","Conditional","Audited","Supervised","Dead-Man Switch"]},
        {key: "intim", name: "AI Intimacy",          plus: "Acceptable", minus: "Objectionable",
         emoji: ["💞", "💔"],
         labels: ["Communal","Companionable","Accepting","Ambivalent","Skeptical","Category Error","Harm Vector"]}
    ];

    function getQueryVariable(variable) {
           var query = window.location.search.substring(1)
           var vars = query.split("&")
           for (var i=0;i<vars.length;i++) {
                   var pair = vars[i].split("=")
                   if(pair[0] == variable) {return pair[1]}
           }
           return(NaN);
    }

    function setBarValue(name, value) {
        innerel = document.getElementById(name)
        outerel = document.getElementById("bar-" + name)
        outerel.style.width = (value + "%")
        innerel.innerHTML = (value + "%")
        if (innerel.offsetWidth + 20 > outerel.offsetWidth) {
            innerel.style.visibility = "hidden"
        }
    }

    function setLabel(val,ary) {
        if (val > 100) { return "" } else
        if (val > 90) { return ary[0] } else
        if (val > 75) { return ary[1] } else
        if (val > 60) { return ary[2] } else
        if (val >= 40) { return ary[3] } else
        if (val >= 25) { return ary[4] } else
        if (val >= 10) { return ary[5] } else
        if (val >= 0) { return ary[6] } else
        { return "" }
    }

    // Build the axis rows dynamically.
    var container = document.getElementById("axes-container")
    var values = {}
    axes.forEach(function(ax) {
        values[ax.key] = parseFloat(getQueryVariable(ax.key))
        if (isNaN(values[ax.key])) { values[ax.key] = 50.0 }
        var h2 = document.createElement("h2")
        h2.innerHTML = ax.name + ': <span class="weight-300" id="label-' + ax.key + '"></span>'
        container.appendChild(h2)
        var div = document.createElement("div")
        div.className = "axis"
        div.innerHTML = '<span id="img-' + ax.key + '" style="font-size:72pt;line-height:1;">' + ax.emoji[0] + '</span>'
            + '<div class="bar" id="bar-' + ax.key + '"><div class="text-wrapper" id="' + ax.key + '"></div></div>'
            + '<div class="bar alt" id="bar-' + ax.key + '-alt"><div class="text-wrapper" id="' + ax.key + '-alt"></div></div>'
            + '<span id="img-' + ax.key + '-alt" style="font-size:72pt;line-height:1;">' + ax.emoji[1] + '</span>'
        container.appendChild(div)
        document.getElementById("label-" + ax.key).innerHTML = setLabel(values[ax.key], ax.labels)
    });

    window.onload = function() {
        axes.forEach(function(ax) {
            var val = values[ax.key]
            var alt = (100 - val).toFixed(1)
            // setBarValue needs the DOM nodes to exist; container is already built.
            setBarValue(ax.key, val)
            setBarValue(ax.key + "-alt", alt)
        })

        var c = document.createElement("canvas")
        var ctx = c.getContext("2d")
        c.width = 800;
        c.height = 170 + 120 * axes.length;
        ctx.fillStyle = "#EEEEEE"
        ctx.fillRect(0, 0, 800, c.height);

        axes.forEach(function(ax, i) {
            var y = 170 + 120 * i
            ctx.fillStyle = "#222222"
            ctx.fillRect(120, y + 10, 560, 80)
            ctx.fillStyle = "#f44336"
            ctx.fillRect(120, y + 14, 5.6 * values[ax.key] - 2, 72)
            ctx.fillStyle = "#00897b"
            ctx.fillRect(682 - 5.6 * (100 - values[ax.key]), y + 14, 5.6 * (100 - values[ax.key]) - 2, 72)
            ctx.font = "60px serif"
            ctx.textAlign = "center"
            ctx.fillStyle = "#222222"
            ctx.fillText(ax.emoji[0], 62, y + 74)
            ctx.fillText(ax.emoji[1], 738, y + 74)
            ctx.font = "300 24px Montserrat"
            ctx.fillText(ax.name + ": " + document.getElementById("label-" + ax.key).innerHTML, 400, y + 100)
            ctx.textAlign = "left"
            if (values[ax.key] > 30) { ctx.fillText(values[ax.key] + "%", 130, y + 60) }
            ctx.textAlign = "right"
            if ((100 - values[ax.key]) > 30) { ctx.fillText((100 - values[ax.key]).toFixed(1) + "%", 670, y + 60) }
        })

        ctx.fillStyle = "#222222"
        ctx.font = "700 80px Montserrat"
        ctx.textAlign = "left"
        ctx.fillText("AI Orientation Quiz", 20, 90)
        ctx.font = "50px Montserrat"
        ctx.fillText(document.getElementById("ideology-label").innerHTML, 20, 140)
        ctx.font = "300 30px Montserrat"
        ctx.textAlign = "right"
        ctx.fillText(version, 780, 90)

        document.getElementById("banner").src = c.toDataURL();
    }
    </script>
</body>
